name: Deploy

# Builds Sonora Live and mirrors the output into the sonora-live/sonora-live.github.io repo
# every time main changes. The website repo is a user/org Pages repo, so GitHub Pages serves
# its root at https://sonora-live.github.io/.
#
# ──────────────────────────────────────────────────────────────────────────
# Setup: a fine-grained Personal Access Token with Contents: read and write on
# sonora-live/sonora-live.github.io, stored in this repo as WEBSITE_DEPLOY_TOKEN.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-website
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web application
        run: npm run build
        env:
          # the relay settings: scrambled into the page by vite.config.ts (not VITE_ variables: Vite would copy
          # those into the page as plain text)
          TURN_URLS: ${{ vars.TURN_URLS }}
          TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          TURN_API: ${{ vars.TURN_API }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          VITE_TIDESIGHT_SITE_ID: ${{ vars.TIDESIGHT_SITE_ID }}
          VITE_TIDESIGHT_URL: ${{ vars.TIDESIGHT_URL }}

      - name: Inject subpath redirect and 404 handler
        run: |
          touch dist/.nojekyll
          mkdir -p dist/sonora-live
          cat << 'EOF' > dist/sonora-live/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Sonora Live</title>
            <meta http-equiv="refresh" content="0; url=https://sonora-live.github.io/">
            <link rel="canonical" href="https://sonora-live.github.io/">
            <script>
              window.location.replace("https://sonora-live.github.io/" + window.location.search + window.location.hash);
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://sonora-live.github.io/">sonora-live.github.io</a>...</p>
          </body>
          </html>
          EOF

          cat << 'EOF' > dist/404.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Sonora Live</title>
            <script>
              (function() {
                var path = window.location.pathname;
                var match = path.match(/^\/sonora-live(?:\/(.*))?$/i);
                if (match) {
                  var sub = match[1] || '';
                  window.location.replace("https://sonora-live.github.io/" + sub + window.location.search + window.location.hash);
                  return;
                }
                window.location.replace("https://sonora-live.github.io/");
              })();
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://sonora-live.github.io/">sonora-live.github.io</a>...</p>
          </body>
          </html>
          EOF

      # The build tags the app's page; this tags any other page and fails the
      # deploy when one cannot be tagged.
      - name: Inject analytics script
        if: vars.TIDESIGHT_URL != '' && vars.TIDESIGHT_SITE_ID != ''
        env:
          ANALYTICS_URL: ${{ vars.TIDESIGHT_URL }}
          ANALYTICS_SITE: ${{ vars.TIDESIGHT_SITE_ID }}
          ANALYTICS_ROOT: dist
        run: |
          python3 - <<'PY'
          # Tags every HTML page published from ANALYTICS_ROOT. A page without </head>
          # fails the deploy instead of going out untracked; a small redirect page is
          # left alone (the page it leads to is counted).
          import os, pathlib, re, sys
          url, site = os.environ["ANALYTICS_URL"], os.environ["ANALYTICS_SITE"]
          root = pathlib.Path(os.environ["ANALYTICS_ROOT"])
          tag = f'  <script async src="{url}" data-site="{site}"></script>\n'
          redirect = re.compile(r"""http-equiv=["']?refresh|location\.replace\(""", re.I)
          tagged, redirects, missing = [], [], []
          for p in sorted(root.rglob("*.html")):
              rel = p.relative_to(root)
              if any(part.startswith(".") or part == "node_modules" for part in rel.parts):
                  continue
              html = p.read_text(encoding="utf-8")
              if url in html:
                  tagged.append(rel.as_posix())
                  continue
              if redirect.search(html) and len(html) < 4000:
                  redirects.append(rel.as_posix())
                  continue
              head = re.search(r"</head\s*>", html, re.I)
              if not head:
                  missing.append(rel.as_posix())
                  continue
              p.write_text(html[:head.start()] + tag + html[head.start():], encoding="utf-8")
              tagged.append(rel.as_posix())
          print("Tagged:", *tagged, sep="\n  ")
          if redirects:
              print("Redirect pages, not tagged:", *redirects, sep="\n  ")
          if missing:
              print("::error::No </head> to tag in: " + ", ".join(missing))
              sys.exit(1)
          if not tagged:
              print("::error::No page was tagged under " + str(root))
              sys.exit(1)
          PY

      - name: Mirror to sonora-live.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN_SONORA_LIVE || secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: sonora-live/sonora-live.github.io
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          user_name: 'sonora-bot'
          user_email: 'bot@users.noreply.github.com'
          commit_message: 'Sync from sonora-live/sonora-live@${{ github.sha }}'
